<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Printer Buddy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0B0B0D; --card: #17161B; --card2: #1F1E24; --line: #26242C; --track: #2A2830; --text: #F4F2F8;
          --muted: #8E8A99; --purple: #7C3AED; --lilac: #C4A7FF; --orange: #FF8A1F; --red: #C9372C; --red-text: #FF6B61; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 Lato, system-ui, -apple-system, Segoe UI, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 18px 16px 40px; display: flex; flex-direction: column; gap: 14px; }
  .brand { font-weight: 900; color: var(--muted); font-size: 14px; }
  .brand span { color: var(--orange); }
  .head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
  h1 { margin: 0; font-size: 26px; font-weight: 900; }
  .tag { padding: 5px 10px; border-radius: 6px; font-size: 13px; font-weight: 900; letter-spacing: .04em; text-transform: uppercase; background: var(--track); }
  .tag.orange { background: var(--orange); color: #1A1005; } .tag.purple { background: var(--purple); color: #fff; }
  .tag.red { background: var(--red); color: #fff; } .tag.grey { color: var(--muted); }
  .box { border-radius: 12px; overflow: hidden; background: var(--card); border: 1px solid var(--line); }
  .cam { position: relative; aspect-ratio: 16 / 9; background: #000; }
  .cam img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .cam:fullscreen, .cam:-webkit-full-screen { aspect-ratio: auto; width: 100vw; height: 100vh; }
  .full { position: absolute; right: 10px; bottom: 10px; z-index: 1; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
          padding: 0; border: 0; border-radius: 8px; background: rgba(0, 0, 0, .55); color: #fff; cursor: pointer; }
  .full:hover { background: rgba(0, 0, 0, .8); }
  .full svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .nocam { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-weight: 700; }
  .bar { height: 6px; background: var(--track); } .bar > div { height: 100%; width: 0; transition: width .5s; }
  .info { padding: 18px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: flex-end; }
  .pct { font-size: 56px; font-weight: 900; line-height: .9; color: var(--orange); }
  .pct small { font-size: 26px; }
  .file { flex: 1 1 240px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .file .state { font-weight: 700; }
  .file .name { color: var(--muted); overflow-wrap: anywhere; }
  dl { margin: 0; display: flex; flex-wrap: wrap; gap: 10px 28px; }
  dl div { display: flex; flex-direction: column; gap: 2px; }
  dt { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  dd { margin: 0; font-size: 20px; font-weight: 900; }
  .note { color: var(--muted); font-size: 13px; text-align: center; }
  .chatbtn { margin-left: auto; font: inherit; font-weight: 700; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card2); color: var(--text); cursor: pointer; }
  .chatbtn[aria-expanded="true"] { background: var(--orange); border-color: var(--orange); color: #1A1005; }
  .chat { margin-top: 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); overflow: hidden; }
  .msgs { height: 220px; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; overflow-wrap: anywhere; }
  .msgs .none { color: var(--muted); margin: auto; text-align: center; }
  .msg b { color: var(--lilac); }
  .msg.owner b { color: var(--orange); }
  .cform { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
  .cform input { min-width: 0; font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  .cform #chatName { flex: 0 1 130px; }
  .cform #chatText { flex: 1 1 auto; }
  .cform button { font: inherit; font-weight: 700; padding: 8px 16px; border-radius: 8px; border: 0; background: var(--purple); color: #fff; cursor: pointer; }
  .chat .note { margin: 0; padding: 0 12px 8px; text-align: left; min-height: 0; }
  .chat .note:empty { display: none; }
  .gone { text-align: center; padding: 80px 16px; }
  .gone h1 { margin-bottom: 10px; }
</style>
</head>
<body>
<main>
  <div class="brand">Printer <span>Buddy</span> · shared view</div>
  <section id="view" hidden>
    <div class="head"><h1 id="name"></h1><span class="tag" id="tag"></span><button type="button" class="chatbtn" id="chatBtn" aria-expanded="false" aria-controls="chat">Chat</button></div>
    <div class="box" style="margin-top:14px">
      <div class="cam"><img id="img" alt="Live view of the printer" hidden><div class="nocam" id="nocam">No camera</div>
        <button type="button" class="full" id="full" title="Full screen" aria-label="Full screen" hidden><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
      <div class="bar"><div id="bar"></div></div>
      <div class="info">
        <span class="pct" id="pct"></span>
        <div class="file"><span class="state" id="state"></span><span class="name" id="file"></span></div>
        <dl>
          <div><dt>Time left</dt><dd id="left">—</dd></div>
          <div><dt>Layer</dt><dd id="layer">—</dd></div>
          <div><dt>Nozzle</dt><dd id="nozzle">—</dd></div>
          <div><dt>Bed</dt><dd id="bed">—</dd></div>
        </dl>
      </div>
    </div>
    <section class="chat" id="chat" hidden aria-label="Chat">
      <div class="msgs" id="msgs" aria-live="polite"></div>
      <form class="cform" id="chatForm">
        <input id="chatName" maxlength="24" placeholder="Your name" autocomplete="nickname" aria-label="Your name">
        <input id="chatText" maxlength="300" placeholder="Say something…" autocomplete="off" aria-label="Message">
        <button type="submit">Send</button>
      </form>
      <p class="note" id="chatErr" role="status"></p>
    </section>
    <p class="note" id="expires"></p>
  </section>
  <section class="gone" id="gone" hidden>
    <h1>Link not available</h1>
    <p class="note" id="goneMsg">This share link has expired or was turned off.</p>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const base = location.pathname.replace(/\/+$/, "");   // works both on the box and behind printerbuddy.stream
const LOOK = {
  printing: ["Printing", "orange", "var(--orange)", "Printing"], paused: ["Paused", "", "var(--orange)", "Paused"],
  complete: ["Done", "purple", "var(--purple)", "Print complete"], cancelled: ["Cancelled", "grey", "var(--muted)", "Print cancelled"],
  error: ["Error", "red", "var(--red)", "Print failed"], standby: ["Idle", "", "var(--orange)", "Ready to print"],
};
const fmtDur = s => { if (s == null) return "—"; s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}h ${m}m` : `${m}m`; };
const fmtTemp = t => t == null ? "—" : `${Math.round(t)}°`;
// current / target, target only while heating (numbers only, safe as HTML)
const fmtTT = (t, tg) => t == null ? "—" : tg > 0 ? `${Math.round(t)}°<span style="color:#8E8A99;font-weight:400"> / ${Math.round(tg)}°</span>` : `${Math.round(t)}°`;
let camMode = null, snapTimer = null;

function setCamera(p) {
  const online = p.connection === "online", idx = Math.min(p.main_cam || 0, Math.max(0, (p.cams || []).length - 1));
  const ok = p.has_webcam && online;
  $("#img").hidden = !ok; $("#nocam").hidden = ok; $("#full").hidden = !ok;
  $("#nocam").textContent = online ? "No camera" : "Printer is offline";
  if (!ok) { camMode = null; clearInterval(snapTimer); return; }
  const live = p.video_live && p.cams?.[idx]?.live;
  const mode = `${live ? "live" : "snap"}:${idx}`;
  if (mode === camMode) return;
  camMode = mode; clearInterval(snapTimer);
  if (live) {
    $("#img").src = `${base}/stream?cam=${idx}`;
    $("#img").onerror = () => { camMode = "snap:" + idx; startSnaps(idx); };
  } else startSnaps(idx);
}
function startSnaps(idx) {
  clearInterval(snapTimer);
  const load = () => { if (!document.hidden) $("#img").src = `${base}/snapshot?cam=${idx}&t=${Date.now()}`; };
  load(); snapTimer = setInterval(load, 3000);
}

async function refresh() {
  let r;
  try { r = await fetch(`${base}/status`, { cache: "no-store" }); } catch { return; }
  if (!r.ok) {
    const msg = await r.json().catch(() => null);
    $("#view").hidden = true; $("#gone").hidden = false;
    if (msg?.error) $("#goneMsg").textContent = msg.error;
    clearInterval(snapTimer); $("#img").removeAttribute("src");
    return;
  }
  const p = await r.json();
  const online = p.connection === "online" && p.klippy_state === "ready";
  const st = !online ? "offline" : (p.state || "standby");
  const [tag, color, bar, line] = LOOK[st] || ["Offline", "grey", "var(--muted)", "Printer is offline"];
  const active = p.state === "printing" || p.state === "paused", showPct = online && (active || p.state === "complete");
  document.title = `${p.name} · Printer Buddy`;
  $("#view").hidden = false; $("#gone").hidden = true;
  $("#name").textContent = p.name;
  $("#tag").textContent = tag; $("#tag").className = `tag ${color}`;
  $("#bar").style.width = `${showPct ? p.progress * 100 : 0}%`; $("#bar").style.background = bar;
  $("#pct").innerHTML = showPct ? `${Math.floor(p.progress * 100)}<small>%</small>` : "";
  $("#pct").style.color = p.state === "complete" ? "var(--lilac)" : "var(--orange)";
  $("#state").textContent = line;
  $("#file").textContent = showPct && p.filename ? p.filename : "";
  $("#left").textContent = online && active ? fmtDur(p.eta) : "—";
  $("#layer").textContent = online && active && p.layer != null ? `${p.layer}${p.total_layers ? " / " + p.total_layers : ""}` : "—";
  $("#nozzle").innerHTML = online ? fmtTT(p.nozzle, p.nozzle_target) : "—";
  $("#bed").innerHTML = online ? fmtTT(p.bed, p.bed_target) : "—";
  $("#expires").textContent = p.expires_at ? `This link stops working ${new Date(p.expires_at * 1000).toLocaleString()}.` : "";
  setCamera(p);
  const chatOn = p.chat !== false;
  $("#chatBtn").hidden = !chatOn;
  if (!chatOn) { $("#chat").hidden = true; clearInterval(chatTimer); }
  else if (mem.get("pb-chat-open") === "1" && $("#chat").hidden) setChat(true);
}
$("#full").onclick = () => {
  const c = $(".cam");
  if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else (c.requestFullscreen || c.webkitRequestFullscreen)?.call(c);
};
$(".cam").ondblclick = () => $("#full").click();
// chat: a room shared by everyone watching this printer; polls only while the box is open
const mem = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
let cid = mem.get("pb-chat-cid");
if (!cid) { cid = Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, "0")).join(""); mem.set("pb-chat-cid", cid); }
let chatLast = 0, chatEpoch = null, chatTimer = null;
$("#chatName").value = mem.get("pb-chat-name") || "";
function showMsg(m) {
  const box = $("#msgs"), stick = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
  box.querySelector(".none")?.remove();
  const d = document.createElement("div"), n = document.createElement("b"), t = document.createElement("span");
  d.className = "msg" + (m.owner ? " owner" : ""); n.textContent = m.name; t.textContent = " " + m.text;
  d.append(n, t); box.append(d);
  if (stick) box.scrollTop = box.scrollHeight;
}
function emptyChat() { const e = document.createElement("div"); e.className = "none"; e.textContent = "No messages yet. Say hello!"; $("#msgs").replaceChildren(e); }
async function pollChat() {
  if ($("#chat").hidden || document.hidden) return;
  let j;
  try { const r = await fetch(`${base}/chat?after=${chatLast}`, { cache: "no-store" }); if (!r.ok) return; j = await r.json(); } catch { return; }
  if (chatEpoch !== null && j.epoch !== chatEpoch) { chatEpoch = j.epoch; chatLast = 0; emptyChat(); return pollChat(); }
  chatEpoch = j.epoch;
  for (const m of j.messages) { showMsg(m); chatLast = Math.max(chatLast, m.id); }
}
function setChat(open) {
  $("#chat").hidden = !open; $("#chatBtn").setAttribute("aria-expanded", String(open)); mem.set("pb-chat-open", open ? "1" : "0");
  clearInterval(chatTimer);
  if (open) { if (!$("#msgs").children.length) emptyChat(); pollChat(); chatTimer = setInterval(pollChat, 3000); $("#chatText").focus({ preventScroll: true }); }
}
$("#chatBtn").onclick = () => setChat($("#chat").hidden);
document.addEventListener("visibilitychange", () => { if (!document.hidden) pollChat(); });
$("#chatForm").onsubmit = async e => {
  e.preventDefault();
  const text = $("#chatText").value.trim(), name = $("#chatName").value.trim();
  if (!text) return;
  mem.set("pb-chat-name", name); $("#chatErr").textContent = "";
  try {
    const r = await fetch(`${base}/chat`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name, text, cid }) });
    if (!r.ok) { const j = await r.json().catch(() => null); $("#chatErr").textContent = j?.error || "Couldn't send that."; return; }
    $("#chatText").value = "";
    pollChat();
  } catch { $("#chatErr").textContent = "Couldn't send that."; }
};
if (mem.get("pb-chat-open") === "1") setChat(true);
refresh(); setInterval(refresh, 3000);
</script>
</body>
</html>
